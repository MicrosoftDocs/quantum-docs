name: Check for build warnings
on: [pull_request_target]
jobs:
  status_checker_job:
    runs-on: ubuntu-latest
    name: Checks the OpenPublishing.Build status check for build warnings

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit
    - uses: MicrosoftDocs/quantum-docs-private/.github/actions/status-checker@3e38936f53b7cd33379637851d7567e1dbe59c53
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
