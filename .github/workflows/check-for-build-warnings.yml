name: Check for build warnings
on: [pull_request_target]
jobs:
  status_checker_job:
    runs-on: ubuntu-latest
    name: Checks the OpenPublishing.Build status check for build warnings

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit
    - uses: MicrosoftDocs/quantum-docs-private/.github/actions/status-checker@main
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
